services:
  api:
    build: { context: ./backend, dockerfile: Dockerfile.api }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pg:pg@postgres:5432/edits
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://s3:4566
    depends_on: [postgres, redis, s3]
    ports: ["8000:8000"]
    volumes: ["./backend:/code", render-tmp:/tmp/renders]
  worker:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    command: python -m app.worker
    env_file: .env
    volumes: ["./backend:/code", render-tmp:/tmp/renders, "./models:/models:ro"]
    depends_on: [redis, postgres, s3]
  s3:
    image: localstack/localstack:4.3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports: ["4566:4566"]
    volumes: [localstack-data:/var/lib/localstack]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: pg, POSTGRES_PASSWORD: pg, POSTGRES_DB: edits }
    volumes: [pg-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    volumes: [redis-data:/data]
volumes: { localstack-data: {}, pg-data: {}, redis-data: {}, render-tmp: {} }
