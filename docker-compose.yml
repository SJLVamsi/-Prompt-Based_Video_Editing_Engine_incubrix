services:
  api:
    build: { context: ./backend, dockerfile: Dockerfile.api }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pg:pg@postgres:5432/edits
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on: [postgres, redis, minio]
    ports: ["8000:8000"]
    volumes: ["./backend:/code", render-tmp:/tmp/renders]
  worker:
    build: { context: ./backend, dockerfile: Dockerfile.worker }
    command: python -m app.worker
    env_file: .env
    volumes: ["./backend:/code", render-tmp:/tmp/renders, "./models:/models:ro"]
    depends_on: [redis, postgres, minio]
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio123 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment: { NEXT_PUBLIC_API_BASE: http://localhost:8000 }
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: pg, POSTGRES_PASSWORD: pg, POSTGRES_DB: edits }
    volumes: [pg-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    volumes: [redis-data:/data]
volumes: { minio-data: {}, pg-data: {}, redis-data: {}, render-tmp: {} }
